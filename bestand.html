<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      /* Iets hoger dan viewport zodat window.scrollTo(0,1) de Safari-balk verbergt */
      min-height: calc(100% + 60px);
      background: #000;
    }

    body {
      /* GEEN overflow:hidden — anders werkt de scroll-truc niet */
      min-height: calc(100vh + 60px);
      touch-action: none;
      overscroll-behavior: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Alle zichtbare elementen zijn position:fixed
       zodat de 1px-scroll ze niet laat bewegen */

    #blocker {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
      );
    }

    #log {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(0.72rem, 3.2vw, 0.88rem);
      color: #00ff00;
      width: 92%;
      max-width: 480px;
      height: 75vh;
      overflow: hidden;
      line-height: 1.9;
      text-shadow: 0 0 5px #00ff00;
    }

    #log .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #prank-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #001200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    #prank-screen.show { display: flex; }

    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #prank-screen .big-emoji { font-size: 90px; }
    #prank-screen h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
      margin: 16px 0 10px;
    }
    #prank-screen p {
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      color: #00ff99;
      margin: 8px 0;
    }
    #prank-screen .credits {
      font-size: 0.8rem;
      color: #555;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<div id="blocker"></div>
<div class="scanlines"></div>
<div id="log"></div>

<div id="prank-screen">
  <div class="big-emoji">😂🎉</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="credits">— iemand die van grappen houdt 💚</div>
</div>

<script>
  /* ---- 1. Safari onderste balk verbergen ---- */
  // Scroll 1px zodat iOS Safari de adresbalk + toolbar wegstopt.
  // Alle content is position:fixed dus die beweegt niet mee.
  function hideSafariBars() {
    window.scrollTo(0, 1);
  }
  // Bij laden
  window.addEventListener('load', function() {
    setTimeout(hideSafariBars, 50);
    setTimeout(hideSafariBars, 300);
    setTimeout(hideSafariBars, 800);
  });
  // Na elke popstate opnieuw (terug-knop reset soms de scroll)
  window.addEventListener('popstate', function() {
    setTimeout(hideSafariBars, 50);
  });

  /* ---- 2. Terug-knop: 50 history states pushen ---- */
  for (var i = 0; i < 50; i++) {
    history.pushState(null, '', location.href);
  }
  function trapBack() {
    for (var j = 0; j < 10; j++) {
      history.pushState(null, '', location.href);
    }
    setTimeout(hideSafariBars, 50);
  }
  window.addEventListener('popstate', trapBack);

  window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  /* ---- 3. Alle events blokkeren (capture-fase) ---- */
  var blocked = true;

  function blockEvt(e) {
    if (!blocked) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  var BLOCK_EVENTS = [
    'click','dblclick','auxclick',
    'mousedown','mouseup','mousemove',
    'pointerdown','pointerup','pointermove','pointercancel',
    'touchstart','touchmove','touchend','touchcancel',
    'gesturestart','gesturechange','gestureend',
    'contextmenu','keydown','keyup','keypress',
    'wheel','dragstart','selectstart','focusin'
    // 'scroll' staat er bewust NIET in — scrollTo(0,1) moet kunnen
  ];
  BLOCK_EVENTS.forEach(function(name) {
    window.addEventListener(name, blockEvt, { capture: true, passive: false });
  });

  /* ---- 4. Scherm wakker houden ---- */
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(function(){});
  }

  /* ---- 5. Nep hack-terminal ---- */
  var logEl       = document.getElementById('log');
  var prankScreen = document.getElementById('prank-screen');
  var blocker     = document.getElementById('blocker');

  var ip = '192.168.'
    + (Math.floor(Math.random() * 254) + 1) + '.'
    + (Math.floor(Math.random() * 254) + 1);
  var contacts = Math.floor(Math.random() * 300) + 50;

  var logLines = [
    '> init secure_shell...',
    '> doelwit gevonden',
    '> ip-adres: ' + ip,
    '> verbinding tot stand gebracht',
    '> firewall omzeild',
    '> root-toegang verkregen',
    '> bestandssysteem koppelen...',
    '> contacten kopiëren... (' + contacts + ')',
    '> berichten uitlezen...',
    '> media-bibliotheek downloaden...',
    '> locatiegeschiedenis ophalen',
    '> opgeslagen wachtwoorden ontcijferen...',
    '> sessietokens onderscheppen',
    '> gegevens uploaden naar server',
    '> [############------] 71%',
    '> camera-stream koppelen...',
    '> microfoon activeren...',
    '> back-up versleutelen...',
    '> sporen wissen...',
    '> proces voltooien...',
  ];

  var TOTAL = 20000;
  var idx = 0;

  function nextLine() {
    if (idx < logLines.length) {
      var old = logEl.querySelector('.cursor');
      if (old) old.classList.remove('cursor');
      var div = document.createElement('div');
      div.textContent = logLines[idx++];
      div.classList.add('cursor');
      logEl.appendChild(div);
    }
  }

  logLines.forEach(function(_, i) {
    setTimeout(nextLine, i * (TOTAL - 2500) / logLines.length);
  });

  /* ---- 6. Na 20 sec: vrijgeven + prank tonen ---- */
  setTimeout(function() {
    blocked = false;
    window.removeEventListener('popstate', trapBack);
    BLOCK_EVENTS.forEach(function(name) {
      window.removeEventListener(name, blockEvt, { capture: true });
    });
    blocker.remove();
    logEl.style.display = 'none';
    prankScreen.classList.add('show');
  }, TOTAL);
</script>
</body>
</html>
