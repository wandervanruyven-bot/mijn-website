<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      background: #000;
    }

    body {
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Volledig transparant blokker-overlay — pakt alle taps/kliks op */
    #blocker {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
      cursor: not-allowed;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
    }

    #log {
      font-size: clamp(0.72rem, 3.2vw, 0.88rem);
      color: #00ff00;
      text-align: left;
      width: 92%;
      max-width: 480px;
      height: 80vh;
      overflow: hidden;
      line-height: 1.8;
      text-shadow: 0 0 5px #00ff00;
    }

    #log .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ---- PRANK REVEAL ---- */
    #prank-screen {
      display: none;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #prank-screen .big-emoji { font-size: 90px; }

    #prank-screen h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
      margin: 16px 0 10px;
      letter-spacing: 1px;
    }

    #prank-screen p {
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      color: #00ff99;
      margin: 8px 0;
      text-shadow: 0 0 6px #00ff99;
    }

    #prank-screen .credits {
      font-size: 0.8rem;
      color: #555;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<!-- Blokkeert alle aanrakingen/klikken tijdens de prank -->
<div id="blocker"></div>

<div class="scanlines"></div>

<div id="log"></div>

<div id="prank-screen">
  <div class="big-emoji">😂🎉</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="credits">— iemand die van grappen houdt 💚</div>
</div>

<script>
  // ---- Wegklikken/teruggaan onmogelijk maken ----
  var blocked = true;

  history.pushState(null, '', location.href);
  history.pushState(null, '', location.href);
  function trapBack() {
    if (blocked) history.pushState(null, '', location.href);
  }
  window.addEventListener('popstate', trapBack);

  // Eén harde blokker voor ALLE invoer (capture-fase = vangt alles eerst af)
  function blockEvt(e) {
    if (!blocked) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    return false;
  }
  var blockedEvents = [
    'click','dblclick','auxclick','mousedown','mouseup','pointerdown',
    'pointerup','pointermove','touchstart','touchmove','touchend',
    'gesturestart','gesturechange','contextmenu','keydown','keyup',
    'wheel','scroll','dragstart','selectstart'
  ];
  blockedEvents.forEach(function(name) {
    window.addEventListener(name, blockEvt, { capture: true, passive: false });
  });

  var beforeUnload = function(e) {
    if (!blocked) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  };
  window.addEventListener('beforeunload', beforeUnload);

  // ---- Nep hack-terminal ----
  var logEl       = document.getElementById('log');
  var prankScreen = document.getElementById('prank-screen');
  var blocker     = document.getElementById('blocker');

  var ip = '192.168.' + (Math.floor(Math.random()*254)+1) + '.' + (Math.floor(Math.random()*254)+1);

  var logLines = [
    '> init secure_shell...',
    '> doelwit gevonden',
    '> ip-adres: ' + ip,
    '> verbinding tot stand gebracht',
    '> firewall omzeild',
    '> root-toegang verkregen',
    '> bestandssysteem koppelen...',
    '> contacten kopiëren... (' + (Math.floor(Math.random()*300)+50) + ')',
    '> berichten uitlezen...',
    '> media-bibliotheek downloaden...',
    '> locatiegeschiedenis ophalen',
    '> opgeslagen wachtwoorden ontcijferen...',
    '> sessietokens onderscheppen',
    '> gegevens uploaden naar server',
    '> [############------] 71%',
    '> camera-stream koppelen...',
    '> microfoon activeren...',
    '> back-up versleutelen...',
    '> sporen wissen...',
    '> proces voltooien...',
  ];

  var TOTAL = 20000; // 20 seconden
  var idx = 0;

  function nextLine() {
    if (idx < logLines.length) {
      // verwijder oude cursor
      var old = logEl.querySelector('.cursor');
      if (old) old.classList.remove('cursor');
      var div = document.createElement('div');
      div.textContent = logLines[idx++];
      div.classList.add('cursor');
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  logLines.forEach(function(_, i) {
    setTimeout(nextLine, i * (TOTAL - 2500) / logLines.length);
  });

  // ---- Na 20 seconden: prank onthullen + alles weer vrijgeven ----
  setTimeout(function() {
    blocked = false;
    window.removeEventListener('popstate', trapBack);
    window.removeEventListener('beforeunload', beforeUnload);
    blockedEvents.forEach(function(name) {
      window.removeEventListener(name, blockEvt, { capture: true });
    });
    blocker.remove();

    logEl.style.display = 'none';
    prankScreen.style.display = 'block';
    document.body.style.background = '#001200';
  }, TOTAL);
</script>
</body>
</html>
