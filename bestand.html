<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      height: 100%;
      /* Iets hoger dan viewport zodat iOS Safari adresbalk kan verdwijnen */
      min-height: calc(100% + 1px);
      background: #000;
    }

    body {
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Blokker: zit over ALLES heen, pakt elke tap */
    #blocker {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
      cursor: not-allowed;
      /* Safe area voor notch/dynamic island */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
      );
    }

    #log {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(0.72rem, 3.2vw, 0.88rem);
      color: #00ff00;
      text-align: left;
      width: 92%;
      max-width: 480px;
      height: 75vh;
      overflow: hidden;
      line-height: 1.9;
      text-shadow: 0 0 5px #00ff00;
    }

    #log .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* PRANK REVEAL */
    #prank-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #001200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }

    #prank-screen.show { display: flex; }

    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #prank-screen .big-emoji { font-size: 90px; }

    #prank-screen h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
      margin: 16px 0 10px;
    }

    #prank-screen p {
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      color: #00ff99;
      margin: 8px 0;
      text-shadow: 0 0 6px #00ff99;
    }

    #prank-screen .credits {
      font-size: 0.8rem;
      color: #555;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<div id="blocker"></div>
<div class="scanlines"></div>
<div id="log"></div>

<div id="prank-screen">
  <div class="big-emoji">😂🎉</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="credits">— iemand die van grappen houdt 💚</div>
</div>

<script>
  /* =========================================================
     1. ADRESBALK VERBERGEN (iOS Safari truc)
     ========================================================= */
  // Scroll 1px naar beneden zodat iOS Safari de adresbalk verbergt
  window.addEventListener('load', function() {
    setTimeout(function() { window.scrollTo(0, 1); }, 50);
  });

  /* =========================================================
     2. TERUGKNOP / NAVIGATIE BLOKKEREN
     ========================================================= */
  // Push veel history-states zodat terug-knop lang werkt
  for (var i = 0; i < 50; i++) {
    history.pushState(null, '', location.href);
  }
  function trapBack() {
    for (var i = 0; i < 10; i++) {
      history.pushState(null, '', location.href);
    }
  }
  window.addEventListener('popstate', trapBack);

  // Tabblad sluiten / weg navigeren blokkeren
  var beforeUnload = function(e) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  };
  window.addEventListener('beforeunload', beforeUnload);

  /* =========================================================
     3. ALLE TOUCH / KLIK EVENTS BLOKKEREN (capture-fase)
     ========================================================= */
  var blocked = true;

  function blockEvt(e) {
    if (!blocked) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }

  var BLOCK_EVENTS = [
    'click', 'dblclick', 'auxclick',
    'mousedown', 'mouseup', 'mousemove',
    'pointerdown', 'pointerup', 'pointermove', 'pointercancel',
    'touchstart', 'touchmove', 'touchend', 'touchcancel',
    'gesturestart', 'gesturechange', 'gestureend',
    'contextmenu', 'keydown', 'keyup', 'keypress',
    'wheel', 'scroll', 'dragstart', 'selectstart', 'focusin'
  ];

  BLOCK_EVENTS.forEach(function(name) {
    window.addEventListener(name, blockEvt, { capture: true, passive: false });
  });

  /* =========================================================
     4. SCHERM WAKKER HOUDEN (Screen Wake Lock)
     ========================================================= */
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(function(){});
  }

  /* =========================================================
     5. NEP HACK-TERMINAL
     ========================================================= */
  var logEl       = document.getElementById('log');
  var prankScreen = document.getElementById('prank-screen');
  var blocker     = document.getElementById('blocker');

  var ip = '192.168.'
    + (Math.floor(Math.random() * 254) + 1) + '.'
    + (Math.floor(Math.random() * 254) + 1);
  var contacts = Math.floor(Math.random() * 300) + 50;

  var logLines = [
    '> init secure_shell...',
    '> doelwit gevonden',
    '> ip-adres: ' + ip,
    '> verbinding tot stand gebracht',
    '> firewall omzeild',
    '> root-toegang verkregen',
    '> bestandssysteem koppelen...',
    '> contacten kopiëren... (' + contacts + ')',
    '> berichten uitlezen...',
    '> media-bibliotheek downloaden...',
    '> locatiegeschiedenis ophalen',
    '> opgeslagen wachtwoorden ontcijferen...',
    '> sessietokens onderscheppen',
    '> gegevens uploaden naar server',
    '> [############------] 71%',
    '> camera-stream koppelen...',
    '> microfoon activeren...',
    '> back-up versleutelen...',
    '> sporen wissen...',
    '> proces voltooien...',
  ];

  var TOTAL = 20000;
  var idx = 0;

  function nextLine() {
    if (idx < logLines.length) {
      var old = logEl.querySelector('.cursor');
      if (old) old.classList.remove('cursor');
      var div = document.createElement('div');
      div.textContent = logLines[idx++];
      div.classList.add('cursor');
      logEl.appendChild(div);
    }
  }

  logLines.forEach(function(_, i) {
    setTimeout(nextLine, i * (TOTAL - 2500) / logLines.length);
  });

  /* =========================================================
     6. NA 20 SECONDEN: ALLES VRIJGEVEN + PRANK TONEN
     ========================================================= */
  setTimeout(function() {
    blocked = false;

    window.removeEventListener('popstate', trapBack);
    window.removeEventListener('beforeunload', beforeUnload);
    BLOCK_EVENTS.forEach(function(name) {
      window.removeEventListener(name, blockEvt, { capture: true });
    });
    blocker.remove();

    logEl.style.display = 'none';
    prankScreen.classList.add('show');
  }, TOTAL);
</script>
</body>
</html>
