<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      min-height: calc(100% + 700px);
      background: #000;
    }
    body {
      min-height: calc(100vh + 700px);
      touch-action: none;
      overscroll-behavior: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #blocker {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      pointer-events: auto;
      touch-action: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 2px,
        rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px
      );
    }

    /* Wachtscherm terwijl camera-permissie gevraagd wordt */
    #init-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #init-screen .dot {
      width: 8px; height: 8px;
      background: #00ff00;
      border-radius: 50%;
      margin: 0 5px;
      animation: dotblink 1.2s infinite;
      box-shadow: 0 0 6px #00ff00;
    }
    #init-screen .dot:nth-child(2) { animation-delay: 0.2s; }
    #init-screen .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotblink {
      0%, 80%, 100% { opacity: 0.1; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }

    #log {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(0.72rem, 3.2vw, 0.88rem);
      color: #00ff00;
      width: 92%;
      max-width: 480px;
      height: 75vh;
      overflow: hidden;
      line-height: 1.9;
      text-shadow: 0 0 5px #00ff00;
    }
    #log .cursor::after {
      content: '█';
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #prank-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #001200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    #prank-screen.show { display: flex; }
    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #prank-screen .big-emoji { font-size: 90px; }
    #prank-screen h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
      margin: 16px 0 10px;
    }
    #prank-screen p {
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      color: #00ff99;
      margin: 8px 0;
    }
    #prank-screen .credits {
      font-size: 0.8rem;
      color: #555;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<div id="blocker"></div>
<div class="scanlines"></div>

<!-- Wachtscherm (zichtbaar tijdens camera-permissie dialoog) -->
<div id="init-screen">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div id="log"></div>

<div id="prank-screen">
  <div class="big-emoji">😂🎉</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="credits">— iemand die van grappen houdt 💚</div>
</div>

<script>
  var initScreen  = document.getElementById('init-screen');
  var logEl       = document.getElementById('log');
  var prankScreen = document.getElementById('prank-screen');
  var blocker     = document.getElementById('blocker');

  /* ---- Safari onderste balk verbergen ---- */
  function hideSafariBars() { window.scrollTo(0, 500); }
  window.addEventListener('load', function() {
    setTimeout(hideSafariBars, 50);
    setTimeout(hideSafariBars, 400);
  });

  /* ---- Terug-knop blokkeren ---- */
  for (var i = 0; i < 50; i++) history.pushState(null, '', location.href);
  function trapBack() {
    for (var j = 0; j < 10; j++) history.pushState(null, '', location.href);
    setTimeout(hideSafariBars, 50);
  }
  window.addEventListener('popstate', trapBack);
  window.addEventListener('beforeunload', function(e) {
    e.preventDefault(); e.returnValue = ''; return '';
  });

  /* ---- Alle events blokkeren ---- */
  var blocked = true;
  function blockEvt(e) {
    if (!blocked) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }
  var BLOCK_EVENTS = [
    'click','dblclick','auxclick',
    'mousedown','mouseup','mousemove',
    'pointerdown','pointerup','pointermove','pointercancel',
    'touchstart','touchmove','touchend','touchcancel',
    'gesturestart','gesturechange','gestureend',
    'contextmenu','keydown','keyup','keypress',
    'wheel','dragstart','selectstart','focusin'
  ];
  BLOCK_EVENTS.forEach(function(name) {
    window.addEventListener(name, blockEvt, { capture: true, passive: false });
  });

  /* ---- Scherm wakker houden ---- */
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(function(){});
  }

  /* ---- Nep hack-terminal regels ---- */
  var ip = '192.168.'
    + (Math.floor(Math.random() * 254) + 1) + '.'
    + (Math.floor(Math.random() * 254) + 1);
  var contacts = Math.floor(Math.random() * 300) + 50;

  var logLines = [
    '> init secure_shell...',
    '> doelwit gevonden',
    '> ip-adres: ' + ip,
    '> verbinding tot stand gebracht',
    '> firewall omzeild',
    '> root-toegang verkregen',
    '> bestandssysteem koppelen...',
    '> contacten kopiëren... (' + contacts + ')',
    '> berichten uitlezen...',
    '> media-bibliotheek downloaden...',
    '> locatiegeschiedenis ophalen',
    '> opgeslagen wachtwoorden ontcijferen...',
    '> sessietokens onderscheppen',
    '> gegevens uploaden naar server',
    '> [############------] 71%',
    '> camera-stream koppelen...',
    '> microfoon activeren...',
    '> back-up versleutelen...',
    '> sporen wissen...',
    '> proces voltooien...',
  ];

  var TOTAL = 20000;
  var idx = 0;

  function nextLine() {
    if (idx < logLines.length) {
      var old = logEl.querySelector('.cursor');
      if (old) old.classList.remove('cursor');
      var div = document.createElement('div');
      div.textContent = logLines[idx++];
      div.classList.add('cursor');
      logEl.appendChild(div);
    }
  }

  /* ---- Start hack (na camera-permissie) ---- */
  function startHack() {
    initScreen.style.display = 'none';
    logEl.style.display = 'block';
    hideSafariBars();

    logLines.forEach(function(_, i) {
      setTimeout(nextLine, i * (TOTAL - 2500) / logLines.length);
    });

    setTimeout(function() {
      blocked = false;
      window.removeEventListener('popstate', trapBack);
      BLOCK_EVENTS.forEach(function(name) {
        window.removeEventListener(name, blockEvt, { capture: true });
      });
      blocker.remove();
      logEl.style.display = 'none';
      prankScreen.classList.add('show');
    }, TOTAL);
  }

  /* ---- Camera + microfoon permissie vragen (echte iOS popup) ---- */
  window.addEventListener('load', function() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(function(stream) {
          // Stop de stream direct — we hebben hem niet nodig
          stream.getTracks().forEach(function(t) { t.stop(); });
          startHack();
        })
        .catch(function() {
          // Geweigerd of fout → hack start gewoon toch
          startHack();
        });
    } else {
      // Browser ondersteunt het niet → direct starten
      startHack();
    }
  });
</script>
</body>
</html>
