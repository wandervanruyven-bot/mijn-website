<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Belangrijk bestand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #hack-screen {
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      pointer-events: none;
    }

    #skull {
      font-size: 80px;
      display: inline-block;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 1; }
      to   { transform: scale(1.1); opacity: 0.7; }
    }

    #title {
      font-size: 2rem;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      margin: 16px 0 8px;
      animation: flicker 1.5s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }

    #log {
      font-size: 0.75rem;
      color: #00ff00;
      text-align: left;
      height: 120px;
      overflow: hidden;
      margin: 12px auto;
      width: 90%;
      line-height: 1.6;
    }

    #progress-wrap {
      width: 90%;
      background: #111;
      border: 1px solid #00ff00;
      border-radius: 4px;
      margin: 12px auto;
      height: 22px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0000, #ff6600);
      transition: width 0.9s linear;
      box-shadow: 0 0 8px #ff0000;
    }

    #timer {
      font-size: 3rem;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 20px #ff0000;
      margin: 8px 0;
    }

    #status {
      font-size: 0.85rem;
      color: #ffff00;
      margin-top: 6px;
    }

    #prank-screen {
      display: none;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.5s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #prank-screen .emoji { font-size: 100px; }

    #prank-screen h1 {
      font-size: 2.5rem;
      color: #ffff00;
      text-shadow: 0 0 12px #ffff00;
      margin: 16px 0 8px;
    }

    #prank-screen p {
      font-size: 1.1rem;
      color: #00ff00;
      margin: 8px 0;
    }

    #prank-screen .small {
      font-size: 0.85rem;
      color: #888;
      margin-top: 20px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
    }
  </style>
</head>
<body>

<div class="scanlines"></div>

<div id="hack-screen">
  <div id="skull">💀</div>
  <div id="title">JE WORDT GEHACKT!</div>
  <div id="log"></div>
  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
  <div id="timer">20</div>
  <div id="status">Wacht tot de hack klaar is...</div>
</div>

<div id="prank-screen">
  <div class="emoji">😂</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt hoor 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="small">— gestuurd door iemand die van je houdt 💚</div>
</div>

<script>
  var logEl      = document.getElementById('log');
  var timerEl    = document.getElementById('timer');
  var barEl      = document.getElementById('progress-bar');
  var hackScreen = document.getElementById('hack-screen');
  var prankScreen= document.getElementById('prank-screen');

  var logLines = [
    '> Verbinding maken met doelwit...',
    '> IP-adres gevonden: 192.168.1.' + Math.floor(Math.random()*255),
    '> Firewall omzeild ✓',
    '> Toegang tot bestanden...',
    '> Contacten gekopieerd ✓',
    '> Foto\'s worden geüpload... 📸',
    '> Wachtwoorden worden gelezen...',
    '> Bank-app gevonden 💳',
    '> Gegevens worden verzonden...',
    '> HACK 87% VOLTOOID...',
    '> Laatste bestanden ophalen...'
  ];

  var seconds = 20;
  var logIndex = 0;

  function addLog() {
    if (logIndex < logLines.length) {
      var line = document.createElement('div');
      line.textContent = logLines[logIndex++];
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  for (var i = 0; i < logLines.length; i++) {
    (function(idx) {
      setTimeout(function() { addLog(); }, idx * (18000 / logLines.length));
    })(i);
  }

  function tick() {
    if (seconds <= 0) {
      hackScreen.style.display = 'none';
      prankScreen.style.display = 'block';
      document.body.style.background = '#001a00';
      return;
    }
    seconds--;
    timerEl.textContent = seconds;
    barEl.style.width = ((20 - seconds) / 20 * 100) + '%';
    setTimeout(tick, 1000);
  }

  setTimeout(tick, 1000);
</script>
</body>
</html>
