<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Bestand_2024.pdf</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    body {
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Volledig transparant blokker-overlay — pakt alle taps/kliks op */
    #blocker {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      cursor: not-allowed;
    }

    /* CRT scanline effect */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
    }

    #hack-screen {
      text-align: center;
      padding: 24px 16px;
      width: 100%;
      max-width: 480px;
    }

    #skull {
      font-size: 72px;
      display: inline-block;
      animation: pulse 0.4s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1);   opacity: 1; }
      to   { transform: scale(1.12); opacity: 0.65; }
    }

    #title {
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 14px #ff0000, 0 0 30px #ff000088;
      margin: 14px 0 6px;
      animation: flicker 1.2s infinite;
      letter-spacing: 2px;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      45%       { opacity: 0.5; }
      55%       { opacity: 0.9; }
    }

    #log {
      font-size: clamp(0.68rem, 3vw, 0.8rem);
      color: #00ff00;
      text-align: left;
      height: 150px;
      overflow: hidden;
      margin: 14px auto;
      width: 92%;
      line-height: 1.7;
      text-shadow: 0 0 4px #00ff00;
    }

    #progress-wrap {
      width: 92%;
      background: #0a0a0a;
      border: 1px solid #ff0000;
      border-radius: 3px;
      margin: 10px auto;
      height: 20px;
      overflow: hidden;
      box-shadow: 0 0 8px #ff000066;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0000, #ff4400, #ff9900);
      box-shadow: 0 0 10px #ff4400;
    }

    #status {
      font-size: clamp(0.75rem, 3.2vw, 0.9rem);
      color: #ffcc00;
      margin-top: 10px;
      animation: blink 1s step-end infinite;
      text-shadow: 0 0 6px #ffcc00;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ---- PRANK REVEAL ---- */
    #prank-screen {
      display: none;
      text-align: center;
      padding: 30px 20px;
      animation: zoomIn 0.6s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #prank-screen .big-emoji { font-size: 90px; }

    #prank-screen h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      color: #ffff00;
      text-shadow: 0 0 16px #ffff00;
      margin: 16px 0 10px;
      letter-spacing: 1px;
    }

    #prank-screen p {
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      color: #00ff99;
      margin: 8px 0;
      text-shadow: 0 0 6px #00ff99;
    }

    #prank-screen .credits {
      font-size: 0.8rem;
      color: #555;
      margin-top: 28px;
    }
  </style>
</head>
<body>

<!-- Blokkeert alle aanrakingen/klikken tijdens de prank -->
<div id="blocker"></div>

<div class="scanlines"></div>

<div id="hack-screen">
  <div id="skull">💀</div>
  <div id="title">JE WORDT GEHACKT!</div>
  <div id="log"></div>
  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
  <div id="status">■ HACK BEZIG... WACHT AF ■</div>
</div>

<div id="prank-screen">
  <div class="big-emoji">😂🎉</div>
  <h1>JE BENT GEPRANKT!</h1>
  <p>Er is helemaal niks gehackt 😄</p>
  <p>Maak je maar geen zorgen!</p>
  <div class="credits">— iemand die van grappen houdt 💚</div>
</div>

<script>
  // Terug-knop blokkeren
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function() {
    history.pushState(null, '', location.href);
  });

  // Alle touch-events blokkeren
  document.addEventListener('touchstart',  function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove',   function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('touchend',    function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('keydown',     function(e){ e.preventDefault(); });

  var logEl       = document.getElementById('log');
  var barEl       = document.getElementById('progress-bar');
  var hackScreen  = document.getElementById('hack-screen');
  var prankScreen = document.getElementById('prank-screen');
  var statusEl    = document.getElementById('status');
  var blocker     = document.getElementById('blocker');

  var ip = '192.168.' + (Math.floor(Math.random()*254)+1) + '.' + (Math.floor(Math.random()*254)+1);

  var logLines = [
    '> Doelwit gevonden...',
    '> IP-adres: ' + ip,
    '> Verbinding tot stand gebracht ✓',
    '> Firewall omzeild ✓',
    '> Toegang tot bestanden verkregen...',
    '> Contacten worden gekopieerd... (' + (Math.floor(Math.random()*300)+50) + ' stuks)',
    '> WhatsApp-berichten worden gelezen... 💬',
    '> Foto\'s worden geüpload... 📸',
    '> Locatiegeschiedenis gevonden 📍',
    '> Bankapp gedetecteerd 💳',
    '> Wachtwoorden worden ontcijferd...',
    '> Gegevens worden doorgestuurd...',
    '> [████████████░░░] 78%',
    '> Camera toegang verkregen 📷',
    '> BIJNA KLAAR...',
  ];

  var TOTAL = 20000; // 20 seconden in ms
  var startTime = Date.now();
  var logIndex = 0;

  // Log-regels gelijkmatig spreiden over 17 seconden
  logLines.forEach(function(line, i) {
    setTimeout(function() {
      var div = document.createElement('div');
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }, i * (17000 / logLines.length));
  });

  // Progress-balk soepel laten lopen
  function updateBar() {
    var elapsed = Date.now() - startTime;
    var pct = Math.min(elapsed / TOTAL * 100, 100);
    barEl.style.width = pct + '%';
    if (elapsed < TOTAL) {
      requestAnimationFrame(updateBar);
    }
  }
  requestAnimationFrame(updateBar);

  // Na 20 seconden: prank onthullen
  setTimeout(function() {
    blocker.remove(); // klikken weer toestaan
    document.removeEventListener('touchstart',  arguments.callee);
    hackScreen.style.display  = 'none';
    prankScreen.style.display = 'block';
    document.body.style.background = '#001200';
  }, TOTAL);
</script>
</body>
</html>
